name: Publish site to GitHub Pages

on:
  push:
    branches: ["arena/48dbf0ae-vegas1"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Point Pages at this branch (legacy branch deploy)
        id: switch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api -X PUT "repos/${{ github.repository }}/pages" \
              -f "source[branch]=${{ github.ref_name }}" \
              -f "source[path]=/" ; then
            echo "switched=true" >> "$GITHUB_OUTPUT"
            echo "Pages source switched to ${{ github.ref_name }}"
            sleep 10
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
          else
            echo "switched=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not switch Pages source via API; will try artifact deploy"
          fi

      - name: Setup Pages
        if: steps.switch.outputs.switched == 'false'
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        if: steps.switch.outputs.switched == 'false'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy artifact to Pages
        if: steps.switch.outputs.switched == 'false'
        id: deployment
        uses: actions/deploy-pages@v4
